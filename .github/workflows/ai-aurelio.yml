name: Compilar AI_AURELIO
on:
  workflow_dispatch:
  push:
    branches: [ai-aurelio-apk]
    paths:
      - 'ai-aurelio/**'
      - '.github/workflows/ai-aurelio.yml'
concurrency:
  group: ai-aurelio-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar proyecto
        run: unzip -q ai-aurelio/AI_AURELIO-Proyecto.zip -d app-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Compilar y realizar pruebas mínimas
        env:
          AI_AURELIO_UNSIGNED: '1'
        run: python3 app-build/AI_AURELIO/scripts/compilar.py
      - name: Preparar herramientas de firma local
        run: |
          mkdir -p entrega
          cp app-build/AI_AURELIO/dist/AI_AURELIO-sin-firma.apk entrega/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" entrega/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging entrega/AI_AURELIO-sin-firma.apk > entrega/identidad.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 entrega/AI_AURELIO-sin-firma.apk > entrega/alineacion.txt
          sha256sum entrega/* > entrega/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AI_AURELIO-compilado
          path: entrega/
          if-no-files-found: error
